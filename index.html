<!DOCTYPE html>
<html lang="en-us" data-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </div>
            <a href="#home" class="nav-logo">Adham El-Sharkawy</a>
            <ul class="nav-menu" id="nav-menu">
                <li class="nav-item">
                    <a href="#home" class="nav-link active">home</a>

                <li class="nav-item">
                    <a href="#about" class="nav-link">about me</a>
                </li>
                <li class="nav-item">
                    <a href="#skills" class="nav-link">skills</a>
                </li>
                <li class="nav-item">

                </li>
                <li class="nav-item">
                    <a href="#contact" class="nav-link">contact</a>
                </li>
            </ul>
            <div class="nav-actions">
                <div class="theme-switcher">
                    <button id="theme-btn" class="theme-btn">
                        <i class="fas fa-moon" aria-hidden="true"></i>
                    </button>
                    <ul class="theme-dropdown" id="theme-dropdown">
                        <li data-theme-value="light" class="dropdown-item">Light</li>
                        <li data-theme-value="dark" class="dropdown-item">Dark</li>
                        <li data-theme-value="auto" class="dropdown-item active-mode">Automatic</li>

                </div>

        </div>

    <script src="js/main.js"></script>
